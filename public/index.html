<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Email Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar app-nav">
    <div class="container-fluid gap-3 flex-wrap">
      <span class="navbar-brand brand"><i class="bi bi-envelope-heart-fill"></i> Email Viewer</span>

      <form id="apiForm" class="d-flex flex-wrap align-items-center gap-2 flex-grow-1">
        <div class="input-group nav-input flex-grow-1">
          <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
          <input id="apiKey" type="password" class="form-control" placeholder="Paste your Email Love API key (el_live_…)" autocomplete="off" required>
        </div>
        <div class="input-group nav-input flex-grow-1">
          <span class="input-group-text"><i class="bi bi-link-45deg"></i></span>
          <input id="apiUrl" type="url" class="form-control" value="https://dev.emaillove.com/v1/emails" title="API link">
        </div>
        <div class="form-check text-white mb-0">
          <input class="form-check-input" id="remember" type="checkbox" checked>
          <label class="form-check-label small" for="remember">Remember</label>
        </div>
        <button type="submit" class="btn btn-grad"><i class="bi bi-cloud-arrow-down-fill"></i> Load</button>
        <button type="button" id="refreshBtn" class="btn btn-glass" title="Reload this page"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
       
      </form>
    </div>
  </nav>

  <main class="layout">
    <aside class="panel list">
      <div class="list-head">
        <span class="fw-semibold"><i class="bi bi-inbox-fill text-primary"></i> Emails <span class="badge rounded-pill count-badge" id="count">0</span></span>
        <div class="input-group input-group-sm search-box">
          <span class="input-group-text"><i class="bi bi-search"></i></span>
          <input id="search" class="form-control" placeholder="Search…">
        </div>
      </div>

      <div class="list-scroll">
        <table class="table table-hover align-middle mb-0">
          <thead><tr><th>Subject</th><th>From</th></tr></thead>
          <tbody id="rows"><tr><td colspan="2" class="muted">Enter your API key and click Load.</td></tr></tbody>
        </table>
      </div>

      <div class="pager">
        <button id="prevBtn" class="btn btn-soft btn-sm" disabled><i class="bi bi-chevron-left"></i> Back 50</button>
        <span id="pageInfo" class="page-info">Page 1</span>
        <button id="nextBtn" class="btn btn-soft btn-sm" disabled>Next 50 <i class="bi bi-chevron-right"></i></button>
      </div>
    </aside>

    <section class="panel viewer">
      <div id="meta" class="meta hidden">
        <div class="subject" id="mSubject"></div>
        <div class="from"><i class="bi bi-person-circle"></i> <span id="mFrom"></span> <span class="date" id="mDate"></span>
          <a id="mLink" target="_blank" rel="noopener" class="ms-2 small">View on Email Love <i class="bi bi-box-arrow-up-right"></i></a></div>
        <div class="tabs">
          <button class="tab active" data-tab="code"><i class="bi bi-code-slash"></i> Code</button>
          <button class="tab" data-tab="preview"><i class="bi bi-eye-fill"></i> Preview</button>
          <button id="copyBtn" class="btn btn-grad btn-sm ms-auto"><i class="bi bi-clipboard-check"></i> Copy</button>
        </div>
      </div>
      <div id="empty" class="empty"><i class="bi bi-envelope-open-heart"></i><div>Select an email to view its HTML code.</div></div>
      <pre id="code" class="code hidden"></pre>
      <iframe id="preview" class="preview hidden" sandbox></iframe>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
